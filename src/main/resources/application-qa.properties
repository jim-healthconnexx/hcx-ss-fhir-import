# HDC-221: QA profile — DB credentials injected from Secrets Manager at startup
spring.datasource.url=
spring.datasource.username=
spring.datasource.password=

aws.region=us-east-1

# HDC-221: Secret ARN for QA DB credentials. Triggers DbSecretsEnvironmentPostProcessor.
aws.secrets.db-credentials-arn=arn:aws:secretsmanager:us-east-1:916169432538:secret:/hcx/qa/db-credentials-hEp1sL

