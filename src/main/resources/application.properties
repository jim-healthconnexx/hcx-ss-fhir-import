spring.application.name=hcx-ss-fhir-import
spring.profiles.active=local

# HDC-221: Actuator — expose health and loggers only
management.endpoints.web.exposure.include=health,loggers
management.endpoint.loggers.enabled=true
management.endpoint.health.show-details=always

# HDC-221: Empty defaults; overridden per profile or at runtime
spring.datasource.url=
spring.datasource.username=
spring.datasource.password=
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jooq.sql-dialect=POSTGRES

# HDC-221: AWS defaults — set per profile or via env vars
aws.region=us-east-1
aws.s3.endpoint=
aws.access-key-id=
aws.secret-access-key=

# HDC-221: FHIR S3 config defaults — overridden per profile
fhir.s3.bucket=
fhir.s3.fhir-prefix=fhir/
fhir.s3.processed-prefix=processed/
fhir.s3.error-prefix=error/
