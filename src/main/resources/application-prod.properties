# HDC-221: Production profile — DB credentials injected from Secrets Manager at startup
spring.datasource.url=
spring.datasource.username=
spring.datasource.password=

aws.region=us-east-1

# HDC-221: Secret ARN for prod DB credentials. Triggers DbSecretsEnvironmentPostProcessor.
aws.secrets.db-credentials-arn=arn:aws:secretsmanager:us-east-1:033147048355:secret:hcx/prod/db-credentials-jKsjzm

# HDC-221: S3 bucket for prod inbound FHIR files
fhir.s3.bucket=ss-inbound-prod

# HDC-265: ECS config for triggering hcx-ss-export-processor after successful import
aws.ecs.enabled=true
aws.ecs.cluster-arn=arn:aws:ecs:us-east-1:033147048355:cluster/hcx-ss-process-prod
aws.ecs.task-definition-arn=hcx-export-processor-prod
aws.ecs.subnets=subnet-020d8d47c0b2e2c88,subnet-0822db3d5762d3c80
aws.ecs.security-groups=sg-0a6dfb8ba918c7941
aws.ecs.assign-public-ip=ENABLED


logging.level.root=INFO
