# HDC-221: Build the Docker image, push to ECR, and deploy to the Production ECS service.
#
# Triggers:
#   - Manual dispatch (workflow_dispatch)
#   - Version tag push (v*) — e.g. `git tag v1.2.3 && git push --tags`
#
# Required GitHub Secrets:
#   AWS_ROLE_ARN_PROD          – IAM role ARN for OIDC federation from GitHub Actions
#   AWS_REGION                 – AWS region (e.g. us-east-1)
#   ECR_REPOSITORY_PROD        – ECR repository name (e.g. hcx-ss-fhir-import)
#   ECS_CLUSTER_PROD           – ECS cluster name (e.g. hcx-ss-process-prod)
#   ECS_SERVICE_PROD           – ECS service name (e.g. hcx-ss-fhir-import-prod)
#   ECS_TASK_DEFINITION_PROD   – Task definition family name (e.g. hcx-ss-fhir-import-prod)

name: Deploy to Production

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      reason:
        description: 'Reason for manual deploy'
        required: false
        default: 'manual hotfix'

permissions:
  id-token: write
  contents: read

jobs:
  deploy:
    name: Build and Deploy to Production
    runs-on: ubuntu-latest
    environment: production

    steps:
      - name: HDC-221 Checkout source
        uses: actions/checkout@v4

      - name: HDC-221 Set up Java 21 (Temurin) with Maven cache
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: temurin
          cache: maven

      - name: HDC-221 Build JAR (skip tests)
        run: ./mvnw -q -DskipTests package

      - name: HDC-221 Configure AWS credentials via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN_PROD }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: HDC-221 Login to Amazon ECR
        id: ecr-login
        uses: aws-actions/amazon-ecr-login@v2

      - name: HDC-221 Resolve image tag (git tag or SHA for manual dispatch)
        id: image-tag
        run: |
          if [[ "${{ github.ref_type }}" == "tag" ]]; then
            echo "tag=${{ github.ref_name }}" >> "$GITHUB_OUTPUT"
          else
            echo "tag=${{ github.sha }}" >> "$GITHUB_OUTPUT"
          fi

      - name: HDC-221 Build and push Docker image (linux/amd64) to ECR
        id: build-image
        env:
          ECR_REGISTRY: ${{ steps.ecr-login.outputs.registry }}
          ECR_REPOSITORY: ${{ secrets.ECR_REPOSITORY_PROD }}
          IMAGE_TAG: ${{ steps.image-tag.outputs.tag }}
        run: |
          docker buildx build --platform linux/amd64 \
            -t "$ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG" \
            -t "$ECR_REGISTRY/$ECR_REPOSITORY:latest" \
            --push .
          echo "image=$ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG" >> "$GITHUB_OUTPUT"

      - name: HDC-221 Download current ECS task definition JSON
        env:
          ECS_TASK_DEFINITION: ${{ secrets.ECS_TASK_DEFINITION_PROD }}
        run: |
          aws ecs describe-task-definition \
            --task-definition "$ECS_TASK_DEFINITION" \
            --query taskDefinition \
            > task-definition.json

      - name: HDC-221 Render updated task definition with new image URI
        id: render-task-def
        uses: aws-actions/amazon-ecs-render-task-definition@v1
        with:
          task-definition: task-definition.json
          container-name: hcx-ss-fhir-import
          image: ${{ steps.build-image.outputs.image }}

      - name: HDC-221 Register and deploy new task definition to Production ECS service
        uses: aws-actions/amazon-ecs-deploy-task-definition@v2
        with:
          task-definition: ${{ steps.render-task-def.outputs.task-definition }}
          service: ${{ secrets.ECS_SERVICE_PROD }}
          cluster: ${{ secrets.ECS_CLUSTER_PROD }}
          wait-for-service-stability: true
