# HDC-221: Build the Docker image, push to ECR, and register a new task definition revision.
# This app runs as a standalone ECS task — no ECS service.
# Production deploy is manual-only.
#
# Required GitHub Secrets (Settings → Secrets → Environments → hcx-prod):
#   AWS_ROLE_ARN_PROD          – IAM role ARN for OIDC federation from GitHub Actions
#   AWS_REGION                 – AWS region (e.g. us-east-1)
#   ECR_REPOSITORY_PROD        – ECR repository name (e.g. hcx-ss-fhir-import)
#   ECS_TASK_DEFINITION_PROD   – Task definition family name (e.g. hcx-ss-fhir-import-prod)

name: Deploy to Production

on:
  workflow_dispatch:
    inputs:
      reason:
        description: 'Reason for manual deploy'
        required: true

permissions:
  id-token: write
  contents: read

jobs:
  deploy:
    name: Build and Deploy to Production
    runs-on: ubuntu-latest
    # HDC-221: When production secrets are set up, create a hcx-prod GitHub environment,
    # add secrets there, and set: environment: hcx-prod

    steps:
      - name: HDC-221 Checkout source
        uses: actions/checkout@v7

      - name: HDC-221 Set up Java 21 (Temurin) with Maven cache
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: temurin
          cache: maven

      - name: HDC-221 Build JAR (skip tests)
        run: ./mvnw -q -DskipTests package

      - name: HDC-221 Configure AWS credentials via OIDC
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN_PROD }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: HDC-221 Login to Amazon ECR
        id: ecr-login
        uses: aws-actions/amazon-ecr-login@v2

      - name: HDC-221 Build and push Docker image (linux/amd64) to ECR
        id: build-image
        env:
          ECR_REGISTRY: ${{ steps.ecr-login.outputs.registry }}
          ECR_REPOSITORY: ${{ secrets.ECR_REPOSITORY_PROD }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          docker buildx build --platform linux/amd64 \
            -t "$ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG" \
            -t "$ECR_REGISTRY/$ECR_REPOSITORY:latest" \
            --push .
          echo "image=$ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG" >> "$GITHUB_OUTPUT"

      - name: HDC-221 Download current ECS task definition JSON
        env:
          ECS_TASK_DEFINITION: ${{ secrets.ECS_TASK_DEFINITION_PROD }}
        run: |
          aws ecs describe-task-definition \
            --task-definition "$ECS_TASK_DEFINITION" \
            --query taskDefinition \
            > task-definition.json

      - name: HDC-221 Render updated task definition with new image URI
        id: render-task-def
        uses: aws-actions/amazon-ecs-render-task-definition@v1
        with:
          task-definition: task-definition.json
          container-name: hcx-ss-fhir-import
          image: ${{ steps.build-image.outputs.image }}
          environment-variables: |
            SPRING_PROFILES_ACTIVE=prod

      - name: HDC-221 Register new task definition revision
        id: register-task-def
        uses: aws-actions/amazon-ecs-deploy-task-definition@v2
        with:
          # HDC-221: No service — standalone ECS task. Registering the new revision is sufficient.
          task-definition: ${{ steps.render-task-def.outputs.task-definition }}

      - name: HDC-221 Print registered task definition ARN
        run: |
          echo "Registered task definition ARN: ${{ steps.register-task-def.outputs.task-definition-arn }}"
